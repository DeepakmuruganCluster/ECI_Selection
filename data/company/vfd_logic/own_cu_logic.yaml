# Control Unit selection logic — company flowchart (ECI-VFD-Selection "Power unit.pdf", which shows the
# control-unit logic; the version in "Control_unit.pdf" lacks the SBC branch and SDI — owner decision V-5).
# Every leaf of the flowchart, read from the rendered page (1 page).
#   path: encoder (motor encoder for position/speed feedback) → advanced (SS1/SLS/SSM/SDI) → sbc → sto → fieldbus
#   fieldbus: none | modbus | profibus | profinet (= "Profinet / Ethernet IP") ; anything else → "part not available"

source:
