# Siemens S7-1500 standard CPUs (central) + SIMATIC ET 200SP distributed I/O (Standard modules) from Catalog ST 70 · 2026.
#
# Transcribed 2026-10-13 from "Selection and ordering data" / "Technical specifications" (page = PDF page), read in the
# text layer and checked on the rendered pages where tables have many columns (p.1410 total output current).
# Architecture (owner 2026-10-13, option 1): S7-1500 CPU in the panel, ET 200SP stations on PROFINET (IM 155-6 PN ST).
# The catalogue prints NO current consumption for the ET 200SP I/O modules (backplane or L+) and none for the S7-1500 CPUs;
# the CPU 1513-1 PN figures are in s71500_cpu1513_power.yaml (equipment manual).
#   kind cpu:   program / data work memory, profinet_max_devices ("Number of connectable IO Devices, max.")
#   kind mc:    SIMATIC Memory Card ("SIMATIC Memory Card required for operation of the CPU", p.524)
#   kind rail:  S7-1500 mounting rail
#   kind im:    interface module incl. BusAdapter BA 2xRJ45 and server module; current_ma = "Current consumption (rated
#               value)", max_modules = "Quantity of operable ET 200SP modules, max."
#   kind bu:    BaseUnit type A0; light = "for starting a new potential group (max. 10 A)", dark = "for continuing"
#   kind io:    Standard (ST) I/O modules, BU type as printed, width 15 mm; DQ: rated output current per channel and
#               "Total current of the outputs – current per module, max."

