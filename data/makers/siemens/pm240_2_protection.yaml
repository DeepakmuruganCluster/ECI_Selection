# PDF page = printed page. Checked against the rendered page images (merged cells per module).
#   max_a: "Max. rated current" of the protective device (devices of the same type with a lower rating may be used, footnote 2)
#   icc_ka: "ICC @ 400 V" — maximum prospective short-circuit current for the drive + device combination
#   phased_out: footnote 1) "not recommended for future use, because already phased-out or will be soon"
#   article: as printed; ".." / "..." = suffix (e.g. terminal version) to be completed
# Power modules 4 … 15 kW (FSB, FSC) have no row in the circuit-breaker table (p. 14).

