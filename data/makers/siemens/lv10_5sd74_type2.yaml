# Siemens 5SD74 surge arresters, type 2, standard design (Catalog LV 10 · 2026, printed 6/16–6/17).
#
# Transcribed 2026-10-13 from the rendered page images, PDF p.518 (left half of the spread) and p.519 (right half:
# the TN-S / TT 3+1 column, 5SD7464). Ordering grid + "Further technical specifications".
# Values printed once across several columns (no white cell separator between them) apply to every column they span;
# the spans were read on a zoomed image. The PV fuse-base types 5SD7483-0KK01/-0KK02 (DC) are not included.
#   system / protection_paths / un / uc / circuit / width: header and ordering grid as printed
#   up_*:   protection level Up (kV, "≤" as printed); None where the table prints "–"
#   in_*:   rated discharge surge current In (8/20 µs), kA; imax_*: max. discharge surge current Imax, kA
#   backup_fuse_*: max. back-up fuse acc. to IEC 61643-1 (gL/gG), A
#   sc_strength_ka: short-circuit strength with max. back-up fuse

