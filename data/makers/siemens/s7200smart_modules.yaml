# Siemens SIMATIC S7-200 SMART: CPUs, expansion modules (EM) and signal boards (SB) with their power budget data.
#
# Transcribed 2026-10-13 from the S7-200 SMART System Manual V2.7 (08/2022, A5E03822230-AK), Appendix A "General
# specifications" tables (page = PDF page = printed page), article numbers checked against Appendix F (p.953-954).
# The text layer was read and the cells checked on the rendered pages; values are as printed.
#   CPU rows: budget_5v_ma = "Current available (EM bus)", budget_24v_ma = "Current available (24 V DC) (sensor power)",
#             i24_per_input_ma = "Digital input current consumption (24 V DC)", max_em / max_sb = expansion limits,
#             PROFINET controller with max. 8 devices ("PROFINET features" table, profinet_page).
#   do_type: sourcing = "Solid state - MOSFET (sourcing)", relay = "Relay, dry contact" (output tables).
#   EM / SB rows: bus_5v_ma = "Current consumption (SM Bus)" / "(5 V DC)"; 24 V DC consumption split into
#             i24_per_input_ma ("4 mA / input used"), i24_per_relay_ma ("11 mA / relay coil used"),
#             i24_fixed_ma (a fixed figure; analog: "no load") and i24_loaded_ma ("20 mA load per channel"); i24_note verbatim.
#   in_24v_*_ma: ST (24 V DC) CPU "Input current" from the Power supply table (power_page): CPU only (without sensor
#             power) / with driving 300 mA sensor power / "CPU with all expansion accessories at max. load"; SR CPUs are
#             AC-fed (0 A from a 24 V supply).
# Compact CPUs CR..s / CR.. are not included: they take no expansion modules or signal boards (p.53).
# Printed oddities kept as printed (owner question PLC-S1): EM DT16 (transistor outputs) lists "11 mA / Relay coil used";
# EM DR32 (relay outputs) lists only "4 mA / Input used"; EM DT08 prints "--". Appendix F p.954 misprints EM AR02 as "6ES 288-3AR02-0AA0"
# (Table A-128 p.873 prints 6ES7288-3AR02-0AA0, used here).

