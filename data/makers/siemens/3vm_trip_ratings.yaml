#   TM210 FTFM: fixed Ir, fixed Ii — PDF p.28 (3-pole table, columns In / Ir / Ii)
#   TM220 ATFM: adjustable Ir (ir_min_a … ir_max_a), fixed Ii — PDF p.30 (3-pole table)
# The 4-pole tables (p.32 TM210, p.34 TM220) print the same In / Ir / Ii values;
# scripts/verify_mccb.py checks all six printed blocks against these rows.
# For TM210, ir_min_a = ir_max_a = the fixed Ir. page = PDF page (printed page numbers are
# section/page, e.g. PDF p.28 = printed "2/4").

