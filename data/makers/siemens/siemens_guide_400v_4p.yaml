# Motor current guide values, standard three-phase motors, 4-pole, 400 V AC, 50 Hz.
#
# Transcribed 2026-10-10 from the column "Motor current I (guide value)" of the
# selection tables in section 3.1 (CLASS 10, type of coordination 2), pp. 28–29.
# Footnote 1 (p. 29): "Guide value for 4-pole standard motors at 400 V AC, 50 Hz.
# Selection depends on the concrete startup and rated data of the protected motor."
# → a guide value is not the motor's rated current; the result says so (basis: guide).
#
# Where a kW appears on several rows (one per MPCB range) the current is the same;
# `page` is the first page it appears on.

