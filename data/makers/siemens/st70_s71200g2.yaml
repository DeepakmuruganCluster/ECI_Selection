# Siemens SIMATIC S7-1200 G2: standard CPUs and signal modules (SM) from Catalog ST 70 · 2026 (chapter 4).
#
# Transcribed 2026-10-13 from "Selection and ordering data" and "Technical specifications" (page = PDF page; printed
# page in 'printed'); the text layer was read and multi-column cells checked on the rendered pages (e.g. p.432).
# The G1 family is not included: Siemens phases it out from 1 November 2026 (owner 2026-10-13: build G2).
# Fail-safe CPUs (1212FC / 1214FC), SIPLUS variants, signal boards (SB), CM / CP and TC / RTD modules are not included.
#   CPU rows: di / do on board, do_type as printed ("relay" for RLY variants; the DC/DC/DC outputs are printed as
#             "6 x DO 24 V DC" without sourcing / sinking → do_type "dc (type not printed)"), max_sm = "Expandable by:
#             … extension modules (SM, CM, or CP)", max_board = extension boards, profinet_max_devices from the
#             technical specifications. The catalogue prints no backplane current or 24 V sensor supply for the G2 CPUs.
#   SM rows: bus_5v_ma = "from backplane bus 5 V DC" (max. or typ. as printed in bus_5v_basis); L+ (24 V DC load
#             voltage) consumption: lplus_per_input_ma ("from load voltage L+ (without load), max.; per channel"),
#             lplus_outputs_ma (digital outputs "from load voltage L+, max."), lplus_per_relay_ma ("per relay coil"),
#             lplus_typ_ma ("Current consumption, typ." of analog / 16DI/16DO modules).

source:
