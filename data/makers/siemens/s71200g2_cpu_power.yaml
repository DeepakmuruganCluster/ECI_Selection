#   sensor supply"; max_sm = "Signal module expansion … max."; do_type from the digital output table ("Solid state –
#   MOSFET (sourcing)" / "Relay, dry contact"); output table pages p.376 (1212C), p.399 (1214C).
#   in_24v_cpu_ma / in_24v_all_ma: "Input current (CPU only)" / "(with all accessories)" at 24 V DC, Power supply tables
#   A-12 (p.375) and A-30 (p.398); AC/DC/RLY CPUs are AC-fed (0 A from a 24 V supply).
#   Temperature (Table A-3, p.361): -20 … 40 °C at maximum specifications; up to 60 °C "with derating": rated voltages and
#   50 % of the current available for expansion devices, on the sensor supply and for the digital outputs, alternate I/O active.
