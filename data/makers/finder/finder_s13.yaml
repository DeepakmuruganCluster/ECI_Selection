# Finder Series 13 electronic step relays (catalogue S13EN, IX-2026). Transcribed 2026-10-11, checked
# against the page images. page = PDF page; printed page numbers equal PDF page numbers (offset 0).
#
# 13.12 "Call & Reset relay 12 V or 24 V AC/DC, 2 pole" is the only relay in the five Finder catalogues
# held that LATCHES on a SET input and is released only by a separate RESET input with a DC supply
# usable from a 24 V DC PLC output (wiring p.11: + to A1 and to the S / R push-buttons, − to A2).
# 13.01 (step relay "BISTABLE", p.8) toggles on every impulse — kept as a rejected candidate.

