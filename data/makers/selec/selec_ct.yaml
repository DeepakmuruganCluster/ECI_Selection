# Selec current transformers, Electrical Measurement & Protection Catalog (2026), PDF pp. 9–10.
# SPCT = square type (p.9), TWCT = tape-wound ring type (p.10). One row per printed burden cell of the
# 'Ordering information' / 'Range Available' tables (Primary current | Accuracy columns, value = rated VA).
# Window from the printed nomenclature: SPCT '(Size) 50/30: 30x10mm; 62/22: DIA 22; 62/30: 30x10mm;
# 62/40: 40x10mm; 100/60: 60x12mm; 140/100: 100x30mm' (p.9); TWCT 'D35: DIA 35, D55: DIA 55, D65: DIA 65,
# D110: DIA110, D120: DIA120' (p.10).
# The SPCT-140/100 table prints 3500 A twice (left column ends 1600, right column 2000, 2500, 3000, 3500,
# 3500, 4000), both 15 VA class 0.5: kept once. Secondary 5 A only (p.9 'Rated secondary output 5A').
# Split-core (SCCT) and cable-type ring (RCT) CTs on the same pages are not transcribed (scope).
# page = PDF page = printed page number.

source:
  ref: SELEC-MEAS
  section: "Current Transformers: SPCT ordering information (p.9), TWCT range available (p.10)"
  printed_page_offset: 0

conditions: {secondary_a: 5, um_max_v: 720}
condition_pages: {secondary: 9, voltage: 9}
designation:
  SPCT: "SPCT-{size}-{primary}/5A-VA{va}-CL{cls}-CE"    # nomenclature p.9 (e.g. SPCT-50/30-60/5A-VA1-CL5-CE)
  TWCT: "TWCT-T-{size}-{primary}/5A-VA{va}-CL{cls}"    # nomenclature p.10 (e.g. TWCT-T-D35-30/5A-VA1.5-CL5)
designation_pages: {SPCT: 9, TWCT: 10}

