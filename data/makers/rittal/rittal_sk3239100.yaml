# Rittal SK 3239.100 TopTherm filter fan — data sheet (pdf-creator, 5 pages, "State: 11/10/2026").
# Page numbers are PDF pages = the number printed at the bottom right ("© Rittal 2026 2").
# Read from the text layer and checked on the rendered page images (pp. 2, 3, 5).
# - The "with outlet filter" airflow is printed without Hz labels ("1 x 3239200: 74/87 m³/h"). The order 50/60 Hz
#   is taken from the same data sheet: p.4 "100/115 m³/h, 230 V, 1~, 50/60 Hz" = p.2 "At 50 Hz: 100 / At 60 Hz: 115".
# - The data sheet contradicts itself on power and current: features table p.2 16.5 W / 14 W, 0.12 A / 0.09 A;
#   tender text p.5 19 / 18 W, 0.12 / 0.11 A (50 / 60 Hz). Both are recorded; R-ACC-10 uses the higher.
# - Frame 204 × 204 mm = 8.03 inch → the "8 inch" fan of the ECI specification (R-ACC-02).

