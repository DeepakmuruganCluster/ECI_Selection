# Rittal TS 8601.060 base/plinth trim panels, side, 100 mm — data sheet (pdf-creator, 3 pages). PDF page = printed.
# These are SIDE trim panels mounted between the front and rear base/plinth components — not the plinth corner
# pieces or front/rear trims (no data sheet held for those, R-ACC-14).
# "To fit Enclosure type: TS: = 600 mm" (p.2) is "for W: 600 mm" in the p.3 product description; on the side of
# the plinth this width is the enclosure depth (our reading, R-ACC-13).
# p.2: "At 200 mm height, two 100 mm base/plinth trim panels may be used." — the only heights named are 100 / 200 mm.

