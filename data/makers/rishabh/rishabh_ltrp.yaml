# Rishabh RISH LTRP series (PU resin, busbar) metering CTs, data sheet REV 08 (version LTRP/0625/00).
# One row per printed (VA, class) pair: each size table prints Primary Current (A) | VA | Class | VA | Class.
# A '-' pair has no row. LTRP 1 prints 80 A twice (5 VA cl 3 / 2.5 VA cl 1, and - / 1 VA cl 0.5): all kept.
# Window = primary aperture from the dimension drawing on the same page (LTRP 1 round Ø20, the others
# rectangular width × height in mm). The window figures are drawn (vector graphics, not text): read from
# the page images; scripts/verify_metering.py cannot re-extract them (see VERIFY.md).
# Secondary current, Um and ambient: rishabh_ltrp_conditions.yaml (p.2). page = PDF page = printed 'Page No.'.
# The PDF also carries hidden text placed outside the page (negative x): not part of the printed table.

