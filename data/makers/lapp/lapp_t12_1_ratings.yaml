#             Source printed: DIN VDE 0298-4, 2003-08, Table 11 column 5.   → PDF p.1 right half, printed p.145
# amps: null = the guide prints "-" (not rated in that column).
# footnote 1: 0.08 … 0.34 mm² are VDE 0891-1 borrowed ratings; footnote 2: 0.5 mm² extended range of Table 11 col 2.
# Columns B (home / portable cords) and D (heavy-duty rubber) are not transcribed: out of scope (SCOPE.md).
# page = PDF page (8 PDF pages, each a spread of two printed pages: printed = 2·page + 142 (left) / + 143 (right)).

