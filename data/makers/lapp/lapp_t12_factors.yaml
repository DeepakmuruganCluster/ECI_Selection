# Lapp Cable Guide "Power Rating" — factors applied to Table 12-1 (page = PDF page; printed page in `printed`).
#   bundle   : footnote 3 to Table 12-1 (PDF p.1, text on PDF p.2): single cores in touch / bundled —
#              "on surfaces": 1~AC or DC 0.76, 3~AC 0.67, "before applying conversion factor of Table 12-6";
#              "free in air or on cable trays": 1~AC or DC 0.8, 3~AC 0.7, before Table 12-8.     printed 146 / 147
#   temp     : Table 12-2 (DIN VDE 0298-4 Table 17), ambient ≠ 30 °C, by rated conductor temperature
#              (60 / 70 / 80 / 85 / 90 °C, "see product page"). Keys = ambient °C; a "-" ends the column.  printed 148
#   heat     : Table 12-4 (DIN VDE 0298-4 Table 18), heat-resistant wires and cables, "applying to current value
#              of Table 12-1, column A, C or D". Key 50 = "up to 50". No 145 °C row is printed.        printed 149
#   cores    : Table 12-3 (DIN VDE 0298-4 Table 26), multiconductor cables up to 10 mm², more than 3 loaded
#              conductors: free-air and in-earth columns.                                                 printed 148
#   group    : Table 12-6 (DIN VDE 0298-4 Table 21), number of current-carrying multicore cables or groups of
#              2- or 3-phase AC circuits of single cores; 1 … 8 on printed p.150, 9 … 20 on p.151.
#              Notice (p.151): only for similarly loaded cables of a similar installation, nominal cross sections
#              differing by one step only.

