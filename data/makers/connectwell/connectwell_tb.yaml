# Connectwell Terminal Blocks Catalogue 25-26 — CP series push-in (screwless) feed-through terminal
# blocks and their accessories. Transcribed 2026-10-11, checked against the page images.
# page = PDF page; printed page = PDF page − 3 (PDF p.12 = printed 9, PDF p.283 = printed 280,
# PDF p.289 = printed 286, PDF p.297 = printed 294).
#
#   kind: terminal  — 2-wire feed-through block; connection ranges in mm² as printed (IEC column):
#                     flex = stranded/flexible, solid, ferrule = with ferrule/lug (1 conductor per clamp);
#                     IEC 60947-7-1 rated voltage / current; end plate, marking tag card, end clamps.
#         jumper    — pluggable jumper of that terminal size: poles and Imax
#         marker    — MC marker card: tags per card (p.289; one packet = 10 cards)
#         statement — printed assembly rules the quantities use (quoted)
# Only the grey (standard) article is transcribed; the colour variants (BU, R, …) are listed on the same page.

