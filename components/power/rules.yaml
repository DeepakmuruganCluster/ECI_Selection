# Power calculation rules: AC consumption per phase (3-phase loads + single-phase loads balanced over L1 / L2 / L3) and
# 24 V DC consumption. Authority: PHYS = physics, RULE = our decision (SIGNOFF.md), OWN = company template.

component: power

rules:
  R-PWR-01: {authority: PHYS, text: "A 3-phase load draws its current equally on L1, L2 and L3: running units × current per unit (drives: the input current from the drive data; DOL, soft-starter and star-delta feeders: the motor FLC). Standby units are not counted (they do not run together)."}
  R-PWR-02: {authority: PHYS, text: "A single-phase load connected line to neutral draws I = VA / U_LN (U_LN = U / √3); one connected line to line (e.g. the control transformer's 415 V primary) draws the same I = VA / U_LL in both of its lines (one single-phase load, two lines carry its current); line currents are added arithmetically — a conservative upper bound of the phasor sum. A load given as a current keeps that current."}
  R-PWR-03: {authority: RULE, text: "Balancing (decision PWR-2): single-phase loads, largest current first, each go to the least-loaded phase (line-to-line loads to the two least-loaded phases); a load given a phase keeps it. Ties go to L1, then L2."}
  R-PWR-04: {authority: RULE, text: "Phase imbalance = (largest phase current − mean of the three) / mean, reported. No limit is held in a source document: shown for information unless the owner sets one (decision PWR-3, parameter imbalance_limit_pct); above that limit → warning."}
  R-PWR-05: {authority: PHYS, text: "Neutral current = the phasor sum of the line-to-neutral loads on L1, L2, L3 (0°, −120°, +120°), assuming the loads have the same power factor (stated). Line-to-line and 3-phase balanced loads add nothing to the neutral."}
  R-PWR-06: {authority: PHYS, text: "Apparent power at the supply = the sum over the loads: 3-phase √3 × U × I, line–neutral U_LN × I, line–line U_LL × I (audit 2026-10-15: not U_LN × the two line currents, which overstated a line–line load by 15 %). Motor powers are listed as the motors' rated output (kW, shaft): their electrical input needs the efficiency and power factor, which a guide value does not give, so no kW total is claimed. QA 2026-10-16 (L7): a single-phase load given in VA counts its own VA; one given in amps counts its own voltage (u_v) × I, else the nominal one."}
  R-PWR-07: {authority: PHYS, text: "A 24 V DC supply fed from the AC side draws P_in = 24 V × its calculated DC load / its efficiency (from its data); its AC current I = P_in / U_LN assumes power factor 1 (its power factor is not held: the current is a lower bound, warning)."}
  R-PWR-08: {authority: OWN,  text: "24 V DC: every load line (quantity × value per unit, with its source) is added; required = subtotal × the company template factor (1.25), compared with the supply chosen or stated. A line without a value makes the total partial (warning) — never filled in."}
  R-PWR-09: {authority: RULE, text: "Loads without consumption data held (e.g. energy meter, phase monitoring relay, HMI) are listed as not counted; the totals say so."}

  R-PWR-10: {authority: OWN,  text: "Company template layout (OWN-SWG-CALC 'U1_Main_Switchgear', 'U1_SMPS Selection', 'U1_Power Reqt'): every AC load is one row (load, description, phase 1 / 3, voltage range, kW, current, protection device, accessory, its current on L1 / L2 / L3), supply loads first; load current with FOS = the largest phase current × the template factor (1.5, cell L27), the basis on which the template selects the main switchgear; input power = √3 × U × the largest phase current × that factor. Columns without data held stay empty — never filled in."}

  R-PWR-11: {authority: RULE, text: "Designer edits (2026-10-15): set a load's connection (line–neutral / line–line), phase(s), current or VA, or a 3-phase load's running units; add a load (single- or 3-phase, e.g. fans, sockets, lamps, a motor the tool could not select); remove a load. Edits are applied before the balancing; every edit must name a load (otherwise invalid); changing or removing a calculated load is a warning and listed, adding one is listed. Feeders the selection could not select are listed as not counted so they can be added. QA 2026-10-16 (L2): edit numbers must be finite and within reason (current 0 … 10 000 A, VA 0 … 1 000 000, kW 0 … 10 000, voltage 0 … 1 000 V, running a whole number 0 … 100), connection LN or LL, names text of at most 120 characters; otherwise invalid."}
  R-PWR-12: {authority: RULE, text: "Owner 2026-10-16 (every output editable): the designer's edits to the 24 V DC rows (edits with dc: true, by row key): set the quantity or the current per unit, add a row (item, quantity, A per unit), remove a row. Quantity 0 … 10 000, current per unit 0 … 100 A. Changed / removed rows → warning, added rows → info. The DC subtotal, × the template factor, the supply check and the supply's AC input follow."}

params:
  imbalance_limit_pct: null
