# Project BOM rules — chains every built component for one panel of a client project (projects/<name>/project.yaml) and offers options for open decisions.
# Holds no data of its own. Authority: RULE = our decision, CLIENT = the project's client documents.

component: project

rules:
  R-PRJ-01: {authority: CLIENT, text: "Load list from the client's load-list document (component 14); client-specified items from the client's automation spec (component 13), both named in project.yaml; enclosures, enclosure accessories and heater feeders are out of scope (owner, 2026-10-11)."}
  R-PRJ-02: {authority: RULE,   text: "Feeders (motor FLC, DOL starter, VFD with protection, control unit, BOP-2, memory card, motor cable) from the panel assembly (component 12)."}
  R-PRJ-03: {authority: CLIENT, text: "Metering (component 15): one energy meter with PROFINET per panel, CTs sized on the client's main incomer rating and busbar."}
  R-PRJ-04: {authority: RULE,   text: "Interface relays (component 16): DOL outputs = DOL starter units from the load list; other outputs = client DO count − DOL outputs; the client DO count is checked against what the relay choice needs."}
  R-PRJ-05: {authority: RULE,   text: "I/O terminals (component 16) = client final I/O channels × terminals per channel (option; 1 by default)."}
  R-PRJ-06: {authority: RULE,   text: "Internal power wiring (component 19) per feeder: drive feeders at the drive input current and protection rating; DOL feeders at the motor FLC and the MPCB range maximum; ambient = panel internal temperature; one circuit per duct unless given."}
  R-PRJ-07: {authority: RULE,   text: "Every open decision is offered as options: the main BOM uses the first option; the Options sheet lists, per alternative, the BOM lines that change."}
  R-PRJ-08: {authority: RULE,   text: "Every component's warnings and refusals are carried to the project's open points."}
  R-PRJ-10: {authority: OWN,    text: "The client's Phoenix 3-phase surge arrester at the main incomer gets its article from the own switchgear database (component 11, 3Ph+N+PE)."}
  R-PRJ-11: {authority: CLIENT, text: "Field devices from the client's instrument list (component 24): 230 V instrument and valve MCBs, fused terminals for analog loops, 24 V load of loops, pneumatic panels and tower lamps; unknown currents are open points."}
  R-PRJ-12: {authority: OWN,    text: "Control circuit (component 25): control supply (transformer / phase-neutral option, CC-1), its MCBs, and the panel's emergency stop and reset from the client's list (ES_MP, RS_0x) plus phase lamps; contactor coil power from the DOL selection (IC 10, R-CC-06) unless the designer gives coil VA; lamp VA from the designer. 24 V DC contactor coils add their holding power to the 24 V load (R-PRJ-13)."}
  R-PRJ-13: {authority: CLIENT, text: "The client's 24 V supplies (SITOP ratings in the client items) are compared with the calculated 24 V load (inputs, relay coils, field devices) × 1.25; plus the PLC electronics from the PLC selection (R-PRJ-14); the HMI current is not held, so the comparison is a lower bound."}
  R-PRJ-14: {authority: RULE,   text: "PLC (component plc) with the settings in the project's project.yaml (make, family, CPU / remote-I/O per panel, memory card): sized on the client's required I/O × 1.4 (company rule), output load = the interface relay coil when relays are used, ambient = panel internal temperature. The capacity must cover the client's final I/O counts; client lines routed to plc (CPU, memory card, IM stations) are compared with the selection and replaced by it — a difference is an open point."}
  R-PRJ-15: {authority: RULE,   text: "Power calculation as its own section: 24 V DC — every load line (inputs at the template figure, interface relay coils, field devices, 24 V DC contactor coils, PLC CPU / interface modules / I/O modules) with quantity, value per unit, total and source; subtotal × 1.25 (template) against the client's stated supplies. 230 V AC control — the control-circuit load lines, × 1.5 and the transformer chosen. Lines without a value are shown as open, never filled."}
  R-PRJ-16: {authority: RULE,   text: "Coverage: the client's shared 'plant' items are carried once, in the panel named by project.yaml plant_items_panel (the other panels get a pointer line); not-built entries for components the project runs (PLC, auxiliary switchgear) are dropped; client items out of scope by owner instruction are listed as out of scope, not left out silently; a coverage list gives every client item and load-list line its status (in the BOM, selected by a component, open with the reason, out of scope)."}
  R-PRJ-20: {authority: RULE,   text: "Owner 2026-10-17 (interdependency audit: 'ask each one'): a panel's design inputs (fault level, panel and cable route temperature, motor power factor, default cable length) and every open option (STO, relays, drive protection, cable and CT make, wire insulation, terminals per channel, memory card, control supply) come from the call or from the panel's saved settings; anything missing is asked on the project page — no first option, no unsourced project value. The supply voltage comes from the project's design_inputs with its source."}
  R-PRJ-17: {authority: RULE,   text: "Designer edits (core/bom_edit.py, projects/<name>/overrides.yaml) are applied last: a replaced article keeps the parts-catalog sources (or is marked not in the held data), quantities are whole numbers ≥ 0, a removed line stays with quantity 0; every edited line keeps its original and says who proposed it (designer, or AI-assisted from the designer's prompt). An edit whose line no longer exists is reported, not dropped silently. The make of an edited or added line comes from the parts catalog, else the designer; added lines go to the group the designer picks (default 'Added by designer'). QA 2026-10-16 (H3): every field of an edit is checked before it is saved (text fields are text of at most 300 characters, quantity a whole number 0 … 10 000, the panel one of the project's); a stored edit that cannot be used is set aside and listed with its reason (undo it), never fatal to the panel."}
  R-PRJ-09: {authority: RULE,   text: "Motor I/O list (component 23) from the load list, with the relay option and STO, checked against the client's DI / DO / AI / AO channels."}

params:
  min_power_wire_mm2: 0.75   # QA 2026-10-16 (M3): company 0.75 mm² control wiring (OWN-PROPEL-SCH160 p.3) as the floor for power wiring, decision RQ-9
  # default_options removed 2026-10-17 (interdependency audit, owner: "ask each one"): every option is answered per panel
  # (project page → saved in overrides.yaml settings); the values used before were sto, latching, fuse, polycab, rishabh,
  # 70, 1 terminal per channel, memory card yes, transformer
