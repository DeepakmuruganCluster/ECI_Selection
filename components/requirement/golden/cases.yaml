# Golden cases for requirement — written BEFORE the code (G4).
# Oracles: the reading rules (rules.yaml) by hand, and the verified components:
#   75 kW, 400 V: motor FLC 132 A (component 1, guide table).
#   VFD heavy duty at 40 °C, 132 A: HO 75 kW 6SL3210-1PE31-8UL0, 145 A ≥ 132 A (SIE-PM240-2 p.105); fuse 3NA3142 (p.105).
#   CU: no encoder, STO, PROFINET → CU240E-2 PN 6SL3244-0BB12-1FA0 (component 4, OWN-CU-LOGIC-ALT).
