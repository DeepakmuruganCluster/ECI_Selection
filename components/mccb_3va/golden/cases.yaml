# Golden cases for mccb_3va — written BEFORE the code (G4), owner 2026-10-20 (RFQ part 1: the client asks a 3VA incomer).
# Oracle: Siemens LV 10 · 2026 (SIE-LV10-2026): PDF p.183 (printed 2/9) In at 50 °C per size, Icu / Ics at 380 … 415 V by
# class (3/4-pole): 3VA11 N25 S36 M55 H70; 3VA12 S36 M55 H70; 3VA13, 3VA14 S36 M55 H70 C110; 3VA15 M55 H70 C110 (Ics 85).
# p.200 (2/26) rated currents per size: 3VA11 16 … 160, 3VA12 160/200/250, 3VA13 320/400, 3VA14 500/630, 3VA15 630/800/1000;
# codes 16 A = 96, 100 A = 10, 630 A = 63, 800 A = 80. p.201 (2/27): breaking code 25 kA = 3, 36 = 4, 55 = 5, 70 = 6,
# 110 = 7; TM240 ATAM = F; without N protection = E; 3-pole = 3; nut keeper = 2. Data sheet 3VA1563-5EF32-0AA0
# (SIE-3VA1563-DS): Ir 440 … 630 A, Ii 3150 … 6300 A, 618 A at 55 °C.
# Rule R-3VA-06 (owner 2026-10-20): smallest In ≥ required, then the smallest frame, then the lowest class.
# Unless stated: 3-pole, 400 V, ambient 40 °C, margin 1.0, Icu basis.

cases:
  - id: A01
    in: {ib_a: 335.35, margin: 1.5, fault_ka: 55, ambient_c: 40}
    expect: {status: warning, article_no: 3VA1463-5EF32-0AA0, frame: 3VA14, in_a: 630, icu_ka: 55, ics_ka: 55, breaking_class: M, confirmed: 0, warnings: [R-3VA-07]}
    oracle: "BIO/UF incomer (RFQ part 1): 335.35 × 1.5 = 503.0 A > 500 → 630 A; smallest frame with 630 A = 3VA14 (p.200); 55 kA → class M (p.183), code 5 (p.201) → 3VA1 4 63-5 E F 3 2-0AA0, assembled from the structure: no data sheet held yet → warning (confirm)"
  - id: A02
    in: {ib_a: 400, margin: 1.5, fault_ka: 36, ambient_c: 40}
    expect: {status: warning, article_no: 3VA1463-4EF32-0AA0, breaking_class: S, icu_ka: 36}
    oracle: "600 A → 3VA14 630 A; 36 kA → class S, code 4 (pp.183, 201)"
  - id: A03
    in: {ib_a: 700, fault_ka: 55, ambient_c: 40}
    expect: {status: warning, article_no: 3VA1580-5EF32-0AA0, frame: 3VA15, in_a: 800}
    oracle: "700 A > 630 → 800 A, only on 3VA15 (p.200), code 80; class M 55 kA (3VA15 starts at M, p.183)"
  - id: A04
    in: {ib_a: 335.35, margin: 1.5, fault_ka: 55, ambient_c: 40, frame: 3VA15}
    expect: {status: ok, article_no: 3VA1563-5EF32-0AA0, confirmed: 1, ir_range: "440 … 630 A", ir_set_a: 503.025, ii_range: "3150 … 6300 A"}
    oracle: "the designer's frame 3VA15: 3VA1563-5EF32-0AA0, confirmed by its data sheet (SIE-3VA1563-DS p.1-2): Ir 440 … 630 A set at the required 503.025 A; Ii 3150 … 6300 A"
  - id: A05
    in: {ib_a: 300, fault_ka: 120, ambient_c: 40}
    expect: {status: cannot_select, rule: R-3VA-05}
    oracle: "120 kA > the highest 3VA1 Icu at 415 V, 110 kA (p.183)"
  - id: A06
    in: {ib_a: 1100, fault_ka: 36, ambient_c: 40}
    expect: {status: cannot_select, rule: R-3VA-03}
    oracle: "1100 A > the largest 3VA1 rating, 1000 A (p.200)"
  - id: A07
    in: {ib_a: 335.35, margin: 1.5, fault_ka: 55, ambient_c: 55, frame: 3VA15}
    expect: {status: ok, article_no: 3VA1563-5EF32-0AA0, in_at_ambient_a: 618}
    oracle: "above 50 °C: the data sheet gives 618 A at 55 °C ≥ 503.0 A (SIE-3VA1563-DS p.1)"
  - id: A08
    in: {ib_a: 335.35, margin: 1.5, fault_ka: 55, ambient_c: 55}
    expect: {status: cannot_select, rule: R-3VA-04}
    oracle: "3VA14 above 50 °C: the catalogue rates In at 50 °C (p.183) and no data sheet with a derating is held → refused, not extrapolated"
  - id: A09
    in: {ib_a: 10, fault_ka: 25, ambient_c: 40}
    expect: {status: warning, article_no: 3VA1196-3EF32-0AA0, frame: 3VA11, in_a: 16, breaking_class: N}
    oracle: "16 A on 3VA11 (rating code 96, p.200); 25 kA → class N, code 3 (pp.183, 201)"
  - id: A10
    in: {ib_a: 500, fault_ka: 100, ambient_c: 40, frame: 3VA15, breaking_basis: ics}
    expect: {status: cannot_select, rule: R-3VA-05}
    oracle: "Ics basis: 3VA15 class C has Icu 110 kA but Ics 85 kA < 100 kA (p.183)"
  - id: A11
    in: {ib_a: 500, fault_ka: 100, ambient_c: 40, frame: 3VA15}
    expect: {status: warning, article_no: 3VA1563-7EF32-0AA0, breaking_class: C, icu_ka: 110, ics_ka: 85}
    oracle: "Icu basis: class C, Icu 110 kA ≥ 100, Ics 85 kA reported (p.183), code 7 (p.201)"
  - id: A12
    in: {ib_a: 300, fault_ka: 36, ambient_c: 40, poles: 4}
    expect: {status: cannot_select, rule: R-3VA-01}
    oracle: "4-pole: neutral protection codes E/F/G not transcribed for this component — refused (scope)"
  - id: A13
    in: {ib_a: 0, fault_ka: 36, ambient_c: 40}
    expect: {status: invalid}
    oracle: "Ib must be > 0"
  - id: A14
    in: {ib_a: 300, fault_ka: 36, ambient_c: 40, frame: 3VA16}
    expect: {status: invalid}
    oracle: "a frame of the 3VA1 range (3VA11 … 3VA15)"
  - id: A15
    in: {ib_a: 300, fault_ka: 36, ambient_c: 40, voltage_v: 690}
    expect: {status: cannot_select, rule: R-3VA-01}
    oracle: "the breaking capacities transcribed are at 380 … 415 V (p.183)"
