# Golden cases for control_power — written BEFORE the code (G4).
# Oracle: hand arithmetic with FINDER-S38 p.13 (10.4 mA) and the template values; SMPS.csv lines.

cases:
  - id: C01
    in: {di: 64, relays: 32, plc_a: 1.5}
    expect: {status: warning, load_a: 3.75, required_a: 4.69, smps: S8VK-S12024, smps_a: 5}
    oracle: "64 × 0.03 + 32 × 0.0104 + 1.5 = 3.7528 A × 1.25 = 4.691 A → OWN-AB-SMPS db1 row 4: S8VK-S12024 5 A (1P+N; first of the 5 A Omron rows)"
  - id: C02
    in: {di: 64, relays: 32}
    expect: {status: cannot_select, rule: R-CP-03}
    oracle: "no PLC current"
  - id: C03
    in: {di: 10, plc_a: 24, input: "3P"}
    expect: {status: warning, required_a: 30.38, smps: S8VK-T96024, smps_a: 40}
    oracle: "(10 × 0.03 + 24) × 1.25 = 30.375 A → OWN-AB-SMPS db1 row 14: S8VK-T96024 40 A (3P)"
  - id: C04
    in: {di: 10, plc_a: 24}
    expect: {status: cannot_select, rule: R-CP-05}
    oracle: "30.4 A > largest Omron 1P+N (20 A)"
  - id: C05
    in: {do: 10, plc_a: 1}
    expect: {status: warning, load_a: 1.5, required_a: 1.88, smps: S8VK-S06024}
    oracle: "10 × 0.05 + 1 = 1.5 A × 1.25 = 1.875 → db1 row 3: S8VK-S06024 2.5 A (first 2.5 A row)"
  - id: C06
    in: {di: -1, plc_a: 1}
    expect: {status: invalid}
    oracle: "negative count"
  - id: C07
    in: {di: 64, relays: 32, plc_a: 1.5, brand: Phoenix}
    expect: {status: warning, warnings: [R-CP-05, R-CP-06]}
    oracle: "Phoenix series are not marked verified in the AutoBOM Logsheet (rows 13–15) → R-CP-06 warning"
  - id: C08
    in: {di: 64, relays: 32, plc_a: 1.5, brand: Siemens}
    expect: {status: ok, smps: 6EP3333-7SB00-0AX0, smps_a: 5, required_a: 4.69}
    oracle: "(was: refused, SITOP waiting for KT 10.1 — owner 2026-10-20, R-CP-08: KT 10.1 transcribed) 3.7528 A × 1.25 = 4.691 A → 1-phase PSU6200 5 A 6EP3333-7SB00-0AX0 (KT 10.1 p.3/9)"
  - id: C09
    in: {di: 64, relays: 32, plc_a: 1.5, communication: true}
    expect: {status: warning, smps: S8VK-X12024A-EIP}
    oracle: "R-CP-07 communication asked → only …-EIP supplies; 4.69 A → Omron sheet row 11 S8VK-X12024A-EIP 5 A (first 5 A port supply)"
  # --- 2026-10-20 (owner, RFQ part 5): Siemens SITOP PSU6200 from catalogue KT 10.1, R-CP-08
  - id: C10
    in: {plc_a: 7.0, input: 3P, brand: Siemens}
    expect: {status: ok, smps: 6EP3434-7SB00-3AX0, smps_a: 10, smps_input_a: 0.39}
    oracle: "7 A × FOS 1.25 = 8.75 A → smallest 3-phase PSU6200 ≥ 8.75 A = 10 A 6EP3434-7SB00-3AX0 (KT 10.1 p.3/21), input 0.39 A at 400 V, efficiency 95.4 % (pp.86-87)"
  - id: C11
    in: {plc_a: 12.0, input: 1P+N, brand: Siemens}
    expect: {status: ok, smps: 6EP3336-7SB00-3AX0, smps_a: 20, smps_efficiency: 0.955}
    oracle: "12 × 1.25 = 15 A → 1-phase PSU6200 20 A 6EP3336-7SB00-3AX0 (p.3/9), efficiency 95.5 % (p.77)"
  - id: C12
    in: {plc_a: 17.0, input: 3P, brand: Siemens}
    expect: {status: cannot_select, rule: R-CP-05}
    oracle: "17 × 1.25 = 21.25 A > the largest PSU6200 transcribed (20 A): refused — several supplies (the panel splits the load)"
  - id: C13
    in: {plc_a: 0.5, input: 3P, brand: Siemens, min_a: 10}
    expect: {status: ok, smps: 6EP3434-7SB00-3AX0, smps_a: 10}
    oracle: "R-CP-09: 0.5 × 1.25 = 0.625 A, the client's 10 A is the minimum → PSU6200 3-phase 10 A (KT 10.1 p.3/21)"
  - id: C14
    in: {plc_a: 9.0, input: 3P, brand: Siemens, min_a: 10}
    expect: {status: warning, smps: 6EP3436-7SB00-3AX0, smps_a: 20, warnings: [R-CP-09]}
    oracle: "9 × 1.25 = 11.25 A > the client's 10 A: the required current decides → 20 A; warning (tell the client)"
