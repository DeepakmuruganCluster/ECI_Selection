# Golden cases for panel — written BEFORE the code (G4).
# Oracles: the components' own golden cases and source pages (the assembly must reproduce them),
# and hand-counted quantities / heat. Common inputs: 400 V, 230 V AC coil, IE3, Polycab in air.

cases:
  - id: P01
    in: {load_list: "M1 7.5 DOL flc=15.5 cable=50", fault_ka: 50, panel_internal_c: 40, motor_pf: 0.85, cable_ambient_c: 40}
    expect: {status: warning, n_lines: 1, n_units: 1, n_selected: 1, n_open: 0, heat_known_w: 0, warnings: [R-PNL-07, R-PNL-08]}
    oracle: "DOL golden D01 (3RV2021-4BA10 + 3RT2027-1AP00); MPCB/contactor losses not sourced → heat incomplete; incomer etc. not built"
  - id: P02
    in: {load_list: "F1 37 VFD flc=66 cable=50", fault_ka: 50, panel_internal_c: 45, motor_pf: 0.85, cable_ambient_c: 40, site_ambient_c: 35, altitude_m: 0}
    expect: {status: warning, n_selected: 1, n_open: 0, heat_known_w: 1130, cooling_method: fan, warnings: [R-PNL-08]}
    oracle: "VFD golden V04: 6SL3210-1PE27-5UL0, loss 1090 W (SIE-PM240-2 p.103) + Control Unit 40 W (p.34) = 1130 W; 35 °C outside < 45 °C inside → fans"
  - id: P03
