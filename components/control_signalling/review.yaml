  do_available: "PLC digital outputs available (client's DO count)"
  terminal_make: {label: "Terminal make", options: ["connectwell", "phoenix"]}
  io_terminals: "I/O terminals (number)"
  io_conductor_mm2: "I/O wire size (mm²)"
