    in: {kw: 7.5, flc_a: 15.5, flc_basis: nameplate, ambient_c: 40, cable_m: 50, fault_ka: 50, network_uk_pct: 2}
    expect: {status: ok, power_module: 6SL3210-1PE21-8UL0, frame: FSB, fuse: "3NA3812 (32 A)", output_a_derated: 18, line_reactor: null, output_reactor: null}
    oracle: "p.100: 7.5 kW LO 18.0 A; p.119 FSA-FSC LO 40 °C 100 % → 18 ≥ 15.5; fuse 3NA3812 32 A"
  - id: V02
    in: {kw: 7.5, flc_a: 15.5, flc_basis: nameplate, ambient_c: 50, cable_m: 50, fault_ka: 50, network_uk_pct: 2}
    expect: {status: warning, power_module: 6SL3210-1PE22-7UL0, frame: FSC, output_a_derated: 22.1, warnings: [R-VFD-04]}
    oracle: "hand calc, p.119 LO 50 °C 85 %: 7.5 kW 18 × 0.85 = 15.3 < 15.5 → 11 kW 26 × 0.85 = 22.1"
  - id: V03
    in: {kw: 7.5, flc_a: 15.5, flc_basis: nameplate, ambient_c: 47, cable_m: 50, fault_ka: 50, network_uk_pct: 2}
