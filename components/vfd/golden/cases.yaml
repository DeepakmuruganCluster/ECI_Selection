# Golden cases for vfd — written BEFORE the code (G4).
# Oracle: PM240-2 manual tables (PDF pages), and hand calculation of derated current
#   = rated output current × table % at the next table temperature at or above the ambient.
# Unless stated: 400 V, unfiltered, shielded cable, nameplate FLC, uk 2 %, fault 50 kA.

