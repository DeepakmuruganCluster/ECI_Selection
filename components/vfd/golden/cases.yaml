    expect: {status: ok, power_module: 6SL3210-1PE27-5UL0, frame: FSD, fuse: "3NA3830 (100 A)", output_a_derated: 69.75, line_reactor: null}
    oracle: "p.103: 37 kW LO 75 A; p.118 FSD-FSF LO 45 °C 93 % → 69.75 ≥ 66; FSD has no line impedance restriction"
  - id: V05
    in: {kw: 37, flc_a: 66, flc_basis: nameplate, ambient_c: 55, cable_m: 50, fault_ka: 50}
    expect: {status: warning, power_module: 6SL3210-1PE28-8UL0, frame: FSE, output_a_derated: 68.4, warnings: [R-VFD-04]}
