# Internal panel wiring rules. Authority: MFR = Lapp Cable Guide "Power Rating" (LAPP-POWER, extracts of
# DIN VDE 0298-4:2003-08), PHYS = arithmetic, RULE = our decision (owner sign-off, SIGNOFF.md),
# CLIENT = client specification. IEC 60364-4-43 / -5-52, IEC 61439-1 and IEC 60204-1 are not held.

component: internal_wiring

rules:
  R-WIR-01: {authority: CLIENT, text: "Scope: the client asks for Lapp cable for internal wiring (client requirement 'internal_wiring', e.g. ECI WNS2503 'LAP Cable Internal Wiring'). Only Lapp Table 12-1 categories A (single cores: H05V-K, H07V-K, H07V2-K, H07Z-K, LiY, multi-standard wiring cable, ÖLFLEX HEAT single cores) and C (multicore power and control cables: ÖLFLEX) are used. Category B (cords for home / portable apparatus), D (heavy-duty rubber), rubber cables (T12-9), welding cables (T12-10) and NEC / AWG sizes (T13): cannot select."}
  R-WIR-02: {authority: MFR, text: "Base current rating at 30 °C from Table 12-1: column A for a single core (1 current-carrying conductor), column C for a multicore cable (2 or 3 current-carrying conductors). A '-' in the column means that size is not rated there."}
  R-WIR-03: {authority: MFR, text: "Installation only as Lapp tabulates it for wiring inside a panel: 'duct' (in a wiring duct / conduit, bunched) and 'surface' (bunched on the mounting plate or a wall) use the Table 12-6 row 'bunched … in conduits or in wireways'; 'air_spaced' (single cores free in air, at least one diameter d from each other and from surfaces, as drawn in column A) uses Table 12-1 alone. Cable trays (Tables 12-7 / 12-8), single cores touching free in air, a multicore cable free in air, ceilings and one-layer arrangements: cannot select."}
  R-WIR-04: {authority: MFR, text: "Single cores in touch or bundled on surfaces (footnote 3 to Table 12-1): multiply the column A rating by 0.76 for a 1~AC or DC circuit, or 0.67 for a 3~AC circuit, before the Table 12-6 grouping factor."}
  R-WIR-05: {authority: RULE, text: "Single cores in a wiring duct or bunched on the mounting plate are treated as 'single cores bundled on surfaces' (footnote 3: 0.76 / 0.67) followed by Table 12-6 row 'bunched … in conduits or in wireways'. Lapp's own note sends single cores in conduits in BUILDINGS (methods A1 / B1) to DIN VDE 0298-4 Tables 3 / 5, which are not held; a panel is not a building installation, so this is our reading (decision W-1)."}
  R-WIR-06: {authority: MFR, text: "Grouping (Table 12-6, row 'bunched … in conduits or in wireways'): factor by the number of current-carrying multicore cables, or of 2- / 3-phase AC circuits of single cores, in the group including this one (1 … 20). A DC or 1~AC circuit of single cores counts as one group. Lapp: only for similarly loaded cables of a similar installation whose cross sections differ by one step only — the designer must make sure (reported)."}
  R-WIR-07: {authority: MFR, text: "Multicore cable with more than 3 current-carrying conductors: Table 12-3 'free air' factor, only for conductors up to 10 mm²; a larger size with more than 3 loaded conductors: cannot select."}
  R-WIR-08: {authority: MFR, text: "Ambient temperature (air around the wiring, i.e. inside the panel): Table 12-2 by the rated conductor temperature printed on the Lapp product page (60, 70, 80, 85 or 90 °C); heat-resistant types listed in Table 12-4 (H07V2-K / H07Z-K 90 °C, H07Z-K 110 °C, ÖLFLEX HEAT 145, ÖLFLEX HEAT 180) use Table 12-4. The rated conductor temperature is an input — no default."}
  R-WIR-09: {authority: RULE, text: "Between two printed rows use the more conservative one: the next hotter temperature row, the next larger number of circuits (Table 12-6) or loaded conductors (Table 12-3). Below the lowest temperature row: the lowest row. Above the last printed value of a column (a '-' or the end of the table), more than 20 circuits or more than 61 loaded conductors: cannot select (no extrapolation)."}
  R-WIR-10: {authority: RULE, text: "Overload coordination (IEC 60364-4-43, not held): Ib ≤ In ≤ Iz when the protective device protects the wiring against overload; Iz ≥ Ib when it does not (e.g. aR fuses, or the VFD protects its output wiring) — then the input flag says so."}
  R-WIR-11: {authority: RULE, text: "Sizes offered: from 0.5 mm² upward (0.08 … 0.34 mm² are VDE 0891-1 telecommunication ratings, footnote 1) and not below a project minimum size if the designer gives one; the smallest size that passes is chosen. One conductor per phase only: if the largest size fails, cannot select (parallel conductors are not tabulated)."}
  R-WIR-12: {authority: PHYS, text: "Iz = Table 12-1 rating × temperature factor × bundling factor × grouping factor × loaded-conductor factor (each factor 1 when it does not apply). Lapp p.146: Table 12-1 values 'have to be taken into consideration of further applicable converting/derating factors'."}
  R-WIR-13: {authority: RULE, text: "Not checked (no held source): voltage drop, short-circuit withstand of the wiring (incl. unprotected conductors ahead of the device), minimum mechanical cross sections (IEC 60204-1 / IEC 61439-1), wire colours and the quantity of wire in metres. Reported on every answer."}

params:
  smallest_offered_mm2: 0.5
  group_counts_max: 20
