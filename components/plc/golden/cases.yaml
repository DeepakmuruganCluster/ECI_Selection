    oracle: "relay, 24 V DC supply → DC/DC/RLY; SM 1221 + SM 1223 8DI/8RLY; 5 V 90 + 105; L+ 24 × 4.1 + 8 × 9 = 98.4 + 72 = 170.4 mA; 2026-10-13 G2 system manual: 195 ≤ 1000 mA; R-PLC-24 (2026-10-14): 1212C DC/DC/RLY 765 mA + 170.4 mA"
