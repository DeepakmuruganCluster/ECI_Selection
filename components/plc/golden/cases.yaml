# Golden cases for plc — written BEFORE the code (G4). Oracle: the AutoBOM rows (sheet, row) and hand arithmetic.
# CPU rows (PLC db.xlsx, sheet db): row 2 CP2E-S30DT1-D 18 DI / 12 DO, 0.02 A 24 V, 0.28 A 5 V, eff 0.7, 3 modules;
# row 10 CP2E-N14DT1-D 8 / 6, 0.02 / 0.22 A, 0 modules; row 8 CP2E-N14DR-D 8 / 6, 0.05 / 0.15 A.
# Modules (PLC IO_db.xlsx, db_DIO): row 11 CP1W-20EDT1 12 / 8, 5 V 0.130 A; row 17 CP1W-40EDT1 24 / 16, 0.160 A;
# row 8 CP1W-16ET1 0 / 16, 0.076 A; 24 V current blank on these rows.

cases:
  - id: P01
    in: {make: omron, di: 4, do: 2}
    expect: {status: ok, cpu: CP2E-N14DT1-D, n_modules: 0, required_di: 6, required_do: 3, i24_a: 0.09}
    oracle: "4 × 1.4 = 5.6 → 6, 2 × 1.4 = 2.8 → 3; N14DT1 (8 / 6) fits; 0.02 + 0.22 × 5 / (24 × 0.7) = 0.0855 A"
  - id: P02
    in: {make: omron, di: 20, do: 10}
    expect: {status: warning, cpu: CP2E-S30DT1-D, n_modules: 1, module_1: CP1W-20EDT1, i24_a: 0.14, warnings: [R-PLC-05]}
    oracle: "need 28 / 14; N14, N20 have no expansion; S30DT1 18 / 12 leaves 10 / 2 → one 20EDT1 (12 / 8); 0.02 + 0.28 × 5/16.8 + 0.13 × 5/16.8 = 0.1420 A; 20EDT1 24 V blank → warning"
  - id: P03
    in: {make: omron, di: 4, do: 2, fieldbus: profinet}
    expect: {status: cannot_select, rule: R-PLC-06}
    oracle: "no CPU records PROFINET"
  - id: P04
    in: {make: omron, di: 4, do: 2, ai: 2}
    expect: {status: cannot_select, rule: R-PLC-02}
    oracle: "analog not selected yet"
  - id: P05
    in: {make: omron, di: 4, do: 2, do_type: relay}
    expect: {status: ok, cpu: CP2E-N14DR-D, i24_a: 0.09}
    oracle: "relay outputs: N14DR-D; 0.05 + 0.15 × 5/16.8 = 0.0946 A"
  - id: P06
    in: {make: omron, di: 200, do: 10}
    expect: {status: cannot_select, rule: R-PLC-04}
    oracle: "280 inputs > any CPU (largest 180 total)"
  - id: P07
    in: {make: omron, di: 40, do: 40}
    expect: {status: warning, cpu: CP2E-S30DT1-D, n_modules: 3, module_1: CP1W-40EDT1, module_2: CP1W-40EDT1, module_3: CP1W-16ET1, i24_a: 0.22}
    oracle: "need 56 / 56; S30DT1 leaves 38 / 44; 2 × 40EDT1 (48 / 32) + 16ET1 (0 / 16) = 48 / 48 in 3 modules; 0.1033 + 2 × 0.0476 + 0.0226 = 0.2212 A"
  - id: P08
    in: {make: omron, di: 0, do: 0}
    expect: {status: invalid}
    oracle: "no I/O"
  # --- Siemens S7-200 SMART (R-PLC-07 … 12), written 2026-10-13 before the code; oracle: system manual V2.7 tables
  # (CPU pp.800-834, EM pp.845-874) and the Appendix B power budget method, by hand.
  - id: P09
    in: {make: siemens, di: 20, do: 10}
    expect: {status: ok, cpu: CPU ST20, n_modules: 1, module_1: EM DT32, required_di: 28, required_do: 14, bus_5v_ma: 185, i24_ma: 112, supply_24v_a: 0.72}
    oracle: "20 × 1.4 = 28, 10 × 1.4 = 14; ST20 12/8 leaves 16 DI / 6 DO → EM DT32 (16/16) alone (DE16 + DT08 needs 2); 5 V 185 mA (p.851); 24 V (12 + 16) × 4 = 112 mA ≤ 300; R-PLC-24 (2026-10-14): ST20 'with all expansion accessories at max. load' 720 mA (p.804), sensor load 112 ≤ 300"
  - id: P10
    in: {make: siemens, di: 20, do: 10, do_type: relay}
    expect: {status: warning, cpu: CPU SR20, module_1: EM DR32, warnings: [R-PLC-11]}
    oracle: "SR20 + EM DR32 (16 DI / 16 relay); DR32 prints no relay-coil current (p.851) → 24 V budget partial"
  - id: P11
    in: {make: siemens, di: 8, do: 4, ai: 4}
