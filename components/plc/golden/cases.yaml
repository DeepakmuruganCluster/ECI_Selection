    oracle: "AI 4 × 1.4 = 5.6 → 6: AE08 (one module; AE04 × 2 needs two, AM06 has 4 AI); 24 V 12 × 4 + 70 (AE08 no load, p.857) = 118 mA"
  - id: P12
    in: {make: siemens, di: 4, do: 4, ao: 2}
    expect: {status: ok, cpu: CPU ST20, module_1: EM AQ04, required_ao: 3, i24_ma: 203}
    oracle: "AO 2 × 1.4 = 2.8 → 3: AQ04 (AQ02 has 2); 24 V 12 × 4 + 155 (AQ04, 20 mA load per channel, p.860) = 203 mA"
  - id: P13
    in: {make: siemens, di: 60, do: 30}
    expect: {status: warning, cpu: CPU ST20, n_modules: 5, required_di: 84, required_do: 42, capacity_di: 84, capacity_do: 48, bus_5v_ma: 725, i24_ma: 336, warnings: [R-PLC-10], supply_24v_a: 0.756}
    oracle: "84 / 42; ST20 leaves 72 / 34; ≥ 5 modules (16 DI max each); 2 × DT32 + 2 × DE16 + DT16 = 72 / 40, spare 6 (the least); 5 V 2×185 + 2×105 + 145 = 725; 24 V (12 + 72) × 4 = 336 > 300 mA → external 24 V ≥ 36 mA; R-PLC-24 (2026-10-14): 720 mA + shortfall 336 − 300 = 36 mA"
  - id: P14
    in: {make: siemens, di: 100, do: 60}
