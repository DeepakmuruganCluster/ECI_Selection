    expect: {status: ok, cpu: CPU 1212C DC/DC/DC, n_modules: 2, module_1: SM 1221 DI 16x24VDC, module_2: "SM 1223 DI 8x24VDC/DQ 8x24VDC 0.5A", bus_5v_ma: 200, i24_lplus_ma: 143.4, supply_24v_a: 0.8434}
    oracle: "28 / 14; 1212C 8 / 6 leaves 20 / 8; one module: SM 1223 16/16 has 16 DI < 20; pairs: SM 1221 + SM 1223 8/8 = 24 / 8, spare 4 (all others 20); 5 V 90 + 110 (p.421, 432); L+ 16 × 4.1 + 8 × 4.1 + 45 = 143.4 mA; 2026-10-13 G2 system manual: outputs sourcing (p.376), 5 V 200 ≤ 1000 mA (p.369); R-PLC-24 (2026-10-14): 1212C DC/DC/DC 700 mA with all accessories (G2 p.375) + modules L+ 143.4 mA"
