# PLC and I/O module rules: Omron CP2E + CP1W (AutoBOM databases, R-PLC-01 … 06) and Siemens S7-200 SMART
# (system manual V2.7, R-PLC-07 … 12).
# Authority: OWN = AutoBOM database / logic sheet (owner decisions PLC-1 … PLC-5); PHYS = physics; RULE = our decision.

component: plc

rules:
  R-PLC-01: {authority: OWN,  text: "Only complete database rows are used: CPUs with I/O count, expansion limit and 24 V / 5 V current (CP2E); modules with their current (CP1W). Incomplete rows (NX1P, NX modules) are listed as not usable."}
  R-PLC-02: {authority: OWN,  text: "Required I/O = signals × 1.4, rounded up (AutoBOM logic sheet row 1: 'consider 40% spare'; PLC-1). Analog I/O is not selected yet (refused)."}
  R-PLC-03: {authority: RULE, text: "Output type as asked (sourcing, sinking or relay; sourcing by default for 24 V DC interface relays, PLC-2): CPU and output modules must have that type; input modules of any type."}
  R-PLC-04: {authority: OWN,  text: "CPUs in order of their total I/O capacity (then database row); the first whose built-in I/O plus at most its 'Max Ext Mod' compatible modules covers the required inputs and outputs is taken. Among module sets: fewest modules, then fewest spare points, then lowest current (PLC-4: replaces the sheet's largest-first order, which can miss a fit)."}
  R-PLC-05: {authority: PHYS, text: "24 V current = Σ (24 V current + 5 V current × 5 V / (24 V × efficiency)) over CPU and modules; a blank 24 V current is taken as 0 (warning, PLC-3)."}
  R-PLC-06: {authority: RULE, text: "Drives on a fieldbus need that fieldbus on the PLC; the database records no fieldbus for any CPU, so a PLC for fieldbus drives cannot be selected (refused)."}
  R-PLC-07: {authority: MFR,  text: "Siemens S7-200 SMART (make siemens): standard CPUs ST (outputs 'Solid state - MOSFET (sourcing)', 24 V DC supply) and SR (outputs 'Relay, dry contact', 120/240 V AC); compact CR CPUs take no expansion and are not used. Output type sourcing → ST CPU and sourcing modules; relay → SR CPU and relay modules; sinking: not in the family (cannot select)."}
  R-PLC-08: {authority: OWN,  text: "Required I/O = signals × 1.4 rounded up (PLC-1), for digital and analog I/O alike. A panel with no wired I/O is valid when it controls PROFINET devices (drives): a CPU is still needed."}
  R-PLC-09: {authority: MFR,  text: "CPUs in order of built-in I/O (20, 30, 40, 60); the first whose built-in I/O plus at most 6 expansion modules (manual: 6 max.) covers the required DI / DO / AI / AO, with Σ module 5 V bus current ≤ the CPU's 1400 mA (Appendix B: otherwise a module must be removed). Among module sets: fewest modules, then fewest spare points, then lowest 5 V current (PLC-4). Digital and analog expansion modules only; signal boards, RTD / TC modules are not chosen automatically."}
  R-PLC-10: {authority: MFR,  text: "24 V DC sensor supply budget (Appendix B, Table B-1): every input of the CPU and modules × 4 mA, every relay output of a relay module × 11 mA, analog modules at their printed current (outputs at '20 mA load per channel'). Above the CPU's 300 mA → warning: an external 24 V DC supply is needed for the difference (not in parallel with the sensor supply)."}
  R-PLC-11: {authority: RULE, text: "A relay module whose general specifications print no relay-coil current (EM DR32) → the 24 V budget is partial (warning, owner question PLC-S1). The '11 mA / Relay coil used' printed for the transistor module EM DT16 is not counted (it has no relays)."}
  R-PLC-12: {authority: MFR,  text: "Drives on PROFINET: ST / SR CPUs are PROFINET controllers for at most 8 devices ('PROFINET features'); more devices → cannot select; the number of devices not given → warning. Other fieldbuses: cannot select."}
  R-PLC-13: {authority: MFR,  text: "Siemens S7-1200 G2 (family s7-1200g2; G1 is phased out from 1 Nov 2026): standard CPUs 1212C / 1214C (ST 70 · 2026; budgets from the G2 system manual). Relay outputs → the RLY variant for the supply asked (24 V DC → DC/DC/RLY, AC → AC/DC/RLY) with relay modules; sourcing → DC/DC/DC ('Solid state – MOSFET (sourcing)', system manual p.376 / 399) with sourcing modules; sinking → cannot select (G2 CPU outputs are sourcing or relay)."}
  R-PLC-14: {authority: MFR,  text: "CPUs in order 1212C, 1214C; the first whose on-board I/O plus at most its 'extension modules' (1212C: 6, 1214C: 10) covers the required DI / DO / AI / AO (× 1.4, R-PLC-08). Among module sets: fewest modules, then fewest spare points, then lowest 5 V backplane current (PLC-4). Digital and analog signal modules only (no signal boards, TC / RTD, CM / CP)."}
  R-PLC-15: {authority: MFR,  text: "Σ module 5 V backplane current (ST 70) ≤ the CPU's 'Current available for expansion devices' (system manual: 1212C 1000 mA, 1214C 1600 mA); a module set above it is not used. Above 40 °C the budget is halved (R-PLC-17)."}
  R-PLC-16: {authority: MFR,  text: "24 V DC load-voltage (L+) current of the signal modules, for the 24 V supply: inputs × 4.1 mA per channel, transistor output modules at their 'from load voltage L+' figure, relay coils × 9 mA, plus 'Current consumption, typ.' where printed. The CPU's own 24 V consumption is not printed in the catalogue (noted)."}
  R-PLC-17: {authority: MFR,  text: "G2 temperature (system manual Table A-3, p.361): up to 40 °C at maximum specifications; 40 … 60 °C only with derating — 50 % of the current available for expansion devices, on the sensor supply and for the digital outputs, with alternate I/O active (warning); above 60 °C → cannot select. PROFINET: up to 31 IO devices; more → cannot select."}
  R-PLC-18: {authority: RULE, text: "S7-1500 + ET 200SP (family s7-1500-et200sp, owner 2026-10-13 option 1): S7-1500 CPU in the panel from the designer (CPU 1511-1 PN / 1513-1 PN / 1515-2 PN; program size and performance are the designer's call); not given → CPU 1513-1 PN (PLC-S4). SIMATIC Memory Card is required (ST 70 p.524): size from the designer, not given → 24 MB (PLC-S5). S7-1500 mounting rail 160 mm for the CPU alone. cpu: none → a remote-I/O panel (ET 200SP stations only, run by a CPU in another panel): no CPU, memory card or rail; its PROFINET devices count at that CPU."}
  R-PLC-19: {authority: RULE, text: "ET 200SP Standard modules for the required I/O (× 1.4, R-PLC-08): 16-channel DI / DQ modules only (owner 2026-10-13: more spare is fine, so every module has its equipment manual held; no 8-channel modules), AI 4xU/I and AQ 4xU/I modules. DQ ST outputs are sourcing; relay or sinking outputs on ET 200SP are not built (cannot select)."}
  R-PLC-20: {authority: MFR,  text: "ET 200SP stations: IM 155-6 PN ST (incl. BusAdapter BA 2xRJ45 and server module) takes at most 32 ET 200SP modules (ST 70 p.1374) → stations = modules / 32 rounded up, filled in the order DI, DQ, AI, AQ. PROFINET devices = stations + drives on PROFINET ≤ the CPU's 'Number of connectable IO Devices, max.' (otherwise cannot select)."}
  R-PLC-21: {authority: MFR,  text: "BaseUnits (BU type A0): the first module of a station on a light BaseUnit (starts a potential group, max. 10 A, ST 70 p.1395), the others on dark ones; a new light BaseUnit is placed where the potential group's current would exceed 10 A: Σ module supply current (equipment manuals: DI 16 ST 90 mA, DQ 16 ST 30 mA, AI 4 U/I ST 117 mA incl. its 2-wire loops, AQ 4 ST 150 mA) + DQ channels × load per channel (designer's dq_load_a; not given → 0.5 A: the DQ 16 ST manual counts 500 mA for a channel switching an inductive load, PLC-S6), at most the module's total. A module whose manual is not held → group current partial (warning)."}
  R-PLC-22: {authority: MFR,  text: "24 V DC for the PLC electronics: CPU 1513-1 PN 0.56 A rated (equipment manual p.44) + 350 mA per IM 155-6 PN ST (ST 70 p.1374) + each module's 'Current consumption, max.' (equipment manuals). Output loads are not included (relay coils are counted by the project). A module or CPU without a held figure → partial (warning)."}
  R-PLC-23: {authority: MFR,  text: "DQ 16x24VDC/0.5A ST total output current ≤ the derating curve (manual Figure 7-1): horizontal 8 A up to 40 °C, 6 A at 50 °C, 4 A at 60 °C; vertical 8 A up to 30 °C, 6 A at 40 °C, 4 A at 50 °C. Between grid points the next higher temperature is used (safe, as V-1); above the curve's end → cannot select. Ambient not given → horizontal, up to 40 °C assumed (noted)."}
  R-PLC-24: {authority: MFR,  text: "24 V DC the PLC draws from the panel's 24 V supply (for control power): S7-200 SMART ST CPUs at 'CPU with all expansion accessories at max. load' (includes the 300 mA sensor supply; Power supply table) plus any sensor-supply shortfall (R-PLC-10); S7-1200 G2 DC CPUs at 'Input current (with all accessories)' (Tables A-12 / A-30) plus the signal modules' L+ current (R-PLC-16); S7-1500 + ET 200SP = R-PLC-22; AC-fed CPUs (SR, AC/DC/RLY) draw 0 A from it."}

params:
  spare_factor: 1.4
  default_do_type: sourcing
  default_make: siemens       # owner 2026-10-14 ("I want to see Siemens"); Omron when asked (make: omron)
  default_siemens_family: s7-200smart
  s71500_default_cpu: CPU 1513-1 PN
  s71500_default_mc_mb: 24
  et200sp_group_max_a: 10
